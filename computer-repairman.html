<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماجراهای مرد تعمیرکار</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050a1a;overflow:hidden;font-family:Tahoma,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;image-rendering:pixelated}
body.g #c{object-fit:contain;object-position:center;background:#000}
#v{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(0,0,0,.55)}
canvas.t{display:block;margin:auto;image-rendering:pixelated}
#title{position:fixed;left:0;right:0;top:17%;text-align:center;pointer-events:none}
#title canvas{filter:drop-shadow(0 5px 0 #6b3508) drop-shadow(0 9px 0 #1a0a00)}
#go{position:fixed;left:50%;top:43%;transform:translateX(-50%);padding:10px 34px 8px;background:#ffc83a;border:0;border-radius:6px;cursor:pointer;box-shadow:0 0 0 4px #1a0a00,0 10px 0 4px #d96a0a,0 10px 0 8px #1a0a00,inset 0 5px 0 #ffe27a;animation:pl 1.2s steps(2) infinite}
#go:active,#go.p{transform:translate(-50%,8px);box-shadow:0 0 0 4px #1a0a00,0 2px 0 4px #d96a0a,0 2px 0 8px #1a0a00,inset 0 5px 0 #ffe27a}
@keyframes pl{50%{filter:brightness(1.1)}}
#sch{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;padding:6px 12px;background:#0b1a33;border:3px solid #2ee6ff;box-shadow:3px 3px 0 #050a1a;font:700 clamp(11px,3.2vw,14px)/1.6 Tahoma,sans-serif;color:#bff8ff;white-space:nowrap}
#me{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;padding:6px 12px;font:700 clamp(12px,3.4vw,15px)/1.6 Tahoma,sans-serif;color:#ffe9b0;white-space:nowrap;background:#6b3a14;border:3px solid #e0a83a;box-shadow:inset 0 0 0 2px #3a1e08,4px 4px 0 #050a1a}
#note{position:fixed;left:0;right:0;top:calc(43% + 86px);text-align:center;pointer-events:none}
#sel{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px;touch-action:manipulation}
body.sl #sel{display:flex}
body.sl #title,body.sl #go,body.sl #note,body.sl #sch,body.sl #me{display:none}
#sel h2{margin:0;font:700 clamp(18px,5vw,26px) Tahoma,sans-serif;color:#ffe9b0;text-shadow:0 2px 0 #000,0 0 12px #000;text-align:center}
#cards{display:flex;gap:18px;justify-content:center;width:100%}
.cc{width:min(42vw,210px);padding:10px 6px 8px;background:#0b1a33;text-align:center;color:#fff;cursor:pointer;border:0;font:inherit;box-shadow:0 0 0 3px #1a0a00,0 0 0 6px #ffc83a,0 0 0 9px #1a0a00,6px 12px 0 6px #050a1a;transition:transform .1s}
.cc:hover,.cc:focus-visible{box-shadow:0 0 0 3px #1a0a00,0 0 0 6px #fff,0 0 0 9px #1a0a00,6px 12px 0 6px #050a1a;outline:0}
.cc:active{transform:translateY(5px)}
.cc canvas{width:62%;display:block;margin:0 auto 8px;image-rendering:pixelated;background:linear-gradient(#10294a,#0b1a33)}
.cc b{display:block;font:700 clamp(12px,3.4vw,15px)/1.5 Tahoma,sans-serif}
.cc small{display:block;color:#9fd8ff;font:clamp(11px,3vw,13px)/1.5 Tahoma,sans-serif;margin-top:4px}
#sb{background:#102a52;color:#fff;border:3px solid #7fe6f0;padding:6px 18px;font:700 14px Tahoma,sans-serif;cursor:pointer}
#obj,#sc,#pad,#tt,#near,#mu{display:none}
#ps{display:none;position:fixed;top:calc(62px + env(safe-area-inset-top,0px));right:8px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2);color:#fff;font-size:16px;padding:2px 8px;border-radius:8px}
body.g #ps{display:block}
#mu{position:fixed;top:calc(30px + env(safe-area-inset-top,0px));right:8px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2);color:#fff;font-size:16px;padding:2px 8px;border-radius:8px}
#card input{display:block;width:100%;margin-top:8px;padding:8px;font:700 15px Tahoma,sans-serif;text-align:center;background:#102a52;color:#fff;border:2px solid #7fe6f0;-webkit-user-select:text;user-select:text}
body.g #title,body.g #go,body.g #note,body.g #sch,body.g #me{display:none}
body.g #obj,body.g #sc,body.g #tt,body.g #near{display:block}
body.g #pad{display:flex}
body.g #mu{display:block}
#obj{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:90px;right:90px;text-align:center;font:700 12px/1.5 Tahoma,sans-serif;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
#sc{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:8px;font:700 13px Tahoma,sans-serif;color:#ffe27a;text-shadow:0 1px 2px #000;pointer-events:none}
#tt{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font:700 13px Tahoma,sans-serif;color:#ffe27a;text-shadow:0 1px 3px #000;pointer-events:none}
#near{position:fixed;bottom:110px;left:0;right:0;text-align:center;font:700 12px Tahoma,sans-serif;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
#pad{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:flex-end;padding:0 12px;direction:ltr;pointer-events:none}
#pad button{pointer-events:auto;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2);color:rgba(255,255,255,.75);font-size:22px;padding:0;touch-action:none}
#dp{display:flex;gap:10px;pointer-events:none}
#dp button{width:64px;height:64px;border-radius:14px}
#ac{display:flex;gap:10px;align-items:flex-end}
#ac button{width:58px;height:58px;border-radius:50%}
#ac #bj{width:64px;height:64px}
@media (pointer:fine){#pad{display:none!important}}
#card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,440px);max-height:92vh;overflow:auto;background:#0b1a33;border:4px solid #ffc83a;box-shadow:0 0 0 4px #1a0a00,6px 6px 0 4px #050a1a;padding:14px;display:none;line-height:1.9;font-size:14px;color:#f1f5ee}
#card h2{margin:0 0 6px;color:#ffc83a;font-size:19px;text-align:center}
#card .st{text-align:center;font-size:40px;letter-spacing:6px;line-height:1.3}
#card .m{color:#b4d2c1;font-size:12px}
#card .pd{margin-top:10px;padding:8px 10px;background:#102a52;border:2px dashed #7fe6f0;color:#bff8ff;font-size:13px}
#card button{display:block;width:100%;margin-top:10px;font:700 16px Tahoma,sans-serif;color:#2a1400;background:#ffc83a;border:0;padding:10px;min-height:44px;box-shadow:0 0 0 3px #1a0a00,0 5px 0 3px #d96a0a;cursor:pointer}
@media (max-aspect-ratio:1/1){#go{top:28%}#note{top:calc(28% + 86px)}#title{top:14%}}
@media (prefers-reduced-motion:reduce){#go{animation:none}}
</style>
</head>
